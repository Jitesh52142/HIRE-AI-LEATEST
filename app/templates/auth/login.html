{% extends "layouts/base.html" %}

{% block title %}Login - Hire AI{% endblock %}

{% block content %}
<div class="row justify-content-center py-5">
    <div class="col-md-6 col-lg-4" data-aos="zoom-in">
        <div class="card glass-card-premium shadow-2xl p-2">
            <div class="card-header border-0 bg-transparent py-4 text-center">
                <div class="login-icon mb-3">
                    <i class="fas fa-lock-open fs-2 text-primary"></i>
                </div>
                <h2 class="auth-title">Welcome Back</h2>
                <p class="text-muted small">Log in to your intelligent workspace</p>
            </div>
            
            <div class="card-body px-4 pb-5">
                <form method="POST" action="{{ url_for('auth.login') }}" class="auth-form">
                    <div class="mb-4">
                        <label class="form-label small fw-bold">Email Address</label>
                        <div class="input-group-premium">
                            <i class="fas fa-envelope"></i>
                            <input type="email" class="form-control" name="email" placeholder="name@company.com" required>
                        </div>
                    </div>
                    
                    <div class="mb-4">
                        <div class="d-flex justify-content-between">
                            <label class="form-label small fw-bold">Password</label>
                            <a href="#" class="text-primary small text-decoration-none">Forgot?</a>
                        </div>
                        <div class="input-group-premium">
                            <i class="fas fa-key"></i>
                            <input type="password" class="form-control" name="password" placeholder="••••••••" required>
                        </div>
                    </div>
                    
                    <button type="submit" class="btn btn-primary w-100 py-3 rounded-pill fw-bold mt-2">
                        <span>Log In</span>
                        <i class="fas fa-sign-in-alt ms-2"></i>
                    </button>
                </form>
                
                <div class="auth-footer text-center mt-4 pt-3 border-top border-light">
                    <p class="text-muted small mb-0">Don't have an account? <a href="{{ url_for('auth.register') }}" class="text-primary fw-bold text-decoration-none">Create one</a></p>
                </div>
            </div>
        </div>
    </div>
</div>

<style>
.auth-title { font-weight: 800; font-family: 'Outfit', sans-serif; letter-spacing: -0.5px; }
.input-group-premium {
    position: relative;
    display: flex;
    align-items: center;
}
.input-group-premium i {
    position: absolute;
    left: 1.2rem;
    color: var(--text-muted);
    font-size: 0.9rem;
    pointer-events: none;
}
.input-group-premium .form-control {
    padding-left: 3rem !important;
    background: rgba(255,255,255,0.6);
}
.glass-card-premium {
    background: rgba(255,255,255,0.8) !important;
    backdrop-filter: blur(25px);
    border: 1px solid var(--glass-border) !important;
}
.login-icon {
    width: 60px;
    height: 60px;
    background: var(--primary-glow);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto;
}
</style>
{% endblock %}
